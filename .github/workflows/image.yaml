# Run this workflow on pull requests or merge to main/release branches
name: Image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_multi_arch_images:
        required: false
        type: string
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        sample:
        - devicequery
        - nbody
        - nvbandwidth
        - simplemultigpu
        - vectoradd
        - vulkan

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        name: Check out code

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          IMAGE_NAME: ghcr.io/nvidia/k8s-samples
          VERSION: ${{ inputs.version }}
          PUSH_ON_BUILD: true
        run: |
          echo "Building ${{ matrix.sample }}"
          make -f deployments/container/Makefile build-${{ matrix.sample }}
